<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Teleprompter Pro Studio - Edición Banda & Músicos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Altura dinámica para dispositivos móviles */
    .app-height {
      height: 100vh;
      height: 100dvh;
    }

    /* Ocultar barra de desplazamiento */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Efectos de espejo para cristales teleprompter */
    .flip-x { transform: scaleX(-1); }
    .flip-y { transform: scaleY(-1); }
    .flip-both { transform: scale(-1, -1); }

    .reading-glow {
      box-shadow: 0 0 35px rgba(14, 165, 233, 0.25);
    }

    /* Fuente de acordes y texto */
    .music-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Estilos de Acordes Musicales */
    .chord-badge {
      font-family: inherit;
      font-size: 0.62em;
      line-height: 1.1;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      display: inline-block;
      min-height: 1.1em;
      white-space: nowrap;
      user-select: none;
    }

    .prompter-word {
      font-weight: inherit;
      font-size: inherit;
      letter-spacing: inherit;
      transition: color 0.12s ease, opacity 0.12s ease;
    }

    /* 1. Pendiente de cantar */
    .word-upcoming {
      color: #ffffff !important;
      opacity: 0.95;
    }

    /* 2. Palabra activa en lectura */
    .word-active {
      color: #38bdf8 !important;
      opacity: 1;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.85);
    }

    /* 3. Ya cantado / pasado */
    .word-passed {
      color: #0284c7 !important;
      opacity: 0.6;
    }

    /* Bloques instrumentales (Intro, Solo de guitarra, Interludios) */
    .section-cue {
      display: block;
      background: linear-gradient(90deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.85));
      border-left: 4px solid #38bdf8;
      padding: 6px 14px;
      margin: 14px 0;
      border-radius: 4px 8px 8px 4px;
      font-size: 0.72em;
      color: #cbd5e1;
      letter-spacing: 0.04em;
    }

    #band-notes-banner {
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      max-height: 140px;
    }
    #band-notes-banner.banner-collapsed {
      max-height: 0 !important;
      opacity: 0 !important;
      padding: 0 !important;
      border-bottom-width: 0 !important;
      pointer-events: none;
    }

    .guide-drag-handle {
      touch-action: none;
      cursor: ns-resize;
    }

    /* Modo Enfoque para Escenario */
    body.focus-mode #main-header,
    body.focus-mode #band-notes-banner,
    body.focus-mode #stats-panel {
      display: none !important;
    }
    body.focus-mode #btn-exit-focus {
      display: flex !important;
    }
  </style>
</head>
<body class="app-height flex flex-col select-none overflow-hidden font-sans bg-black pb-[env(safe-area-inset-bottom)]">

  <!-- ================= BARRA DE CONTROL SUPERIOR ================= -->
  <header id="main-header" class="bg-slate-900/95 backdrop-blur border-b border-slate-800 z-50 pt-[env(safe-area-inset-top)] shrink-0 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
      
      <!-- Controles Principales (Play / Metrónomo / Rebobinar) -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-toggle-play" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold transition active:scale-95 shadow-md shadow-sky-950/50">
          <svg id="play-icon" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" class="w-3.5 h-3.5 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          <span id="play-label">Iniciar</span>
        </button>

        <button id="btn-rewind" title="Rebobinar canción (R)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 active:scale-95 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>

        <!-- Metrónomo Visual de Escenario -->
        <div class="flex items-center gap-1 bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700" title="Metrónomo Visual en vivo">
          <div id="metro-light" class="w-2.5 h-2.5 rounded-full bg-slate-600 transition-colors duration-75"></div>
          <span id="bpm-display" class="font-mono font-bold text-sky-400 min-w-[28px] text-center">80</span>
          <span class="text-[9px] text-slate-400 font-mono">BPM</span>
          <button id="btn-audio-click" class="ml-1 text-[10px] text-slate-400 hover:text-white" title="Activar/Desactivar sonido de claqueta">🔈</button>
        </div>
      </div>

      <!-- Selector de Canciones y Repertorio -->
      <div class="flex items-center gap-1 bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700">
        <button id="btn-prev-song" title="Tema anterior (P o [)" class="p-1 text-slate-400 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <select id="select-active-song" class="bg-slate-900 text-slate-200 text-xs font-semibold px-2 py-0.5 rounded border border-slate-700 focus:outline-none max-w-[130px] sm:max-w-[190px] truncate cursor-pointer"></select>

        <button id="btn-next-song" title="Tema siguiente (N o ])" class="p-1 text-slate-400 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>

        <button id="btn-open-setlist" class="ml-1 flex items-center gap-1 px-2 py-0.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-[11px] transition">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
          <span class="hidden sm:inline">Setlist</span>
        </button>
      </div>

      <!-- Herramientas Musicales: Transposición de Acordes & Visibilidad -->
      <div class="flex items-center gap-1 bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700">
        <span class="text-slate-400 text-[11px] font-medium">Tono:</span>
        <button id="btn-transpose-down" title="Bajar un semitono (-1)" class="w-5 h-5 flex items-center justify-center rounded bg-slate-700 hover:bg-slate-600 text-sky-400 font-black">-</button>
        <span id="transpose-indicator" class="font-mono text-sky-400 font-bold min-w-[24px] text-center text-xs">0</span>
        <button id="btn-transpose-up" title="Subir un semitono (+1)" class="w-5 h-5 flex items-center justify-center rounded bg-slate-700 hover:bg-slate-600 text-sky-400 font-black">+</button>
        
        <button id="btn-toggle-chords" class="ml-1 px-1.5 py-0.5 rounded bg-sky-950 border border-sky-500/40 text-sky-300 font-mono font-bold text-[10px] transition">
          Acordes: ON
        </button>
      </div>

      <!-- Reconocimiento de Voz y Configuración Visual -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-toggle-voice" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-sky-600 text-white font-semibold text-xs border border-sky-400/40">
          <span class="relative flex h-2 w-2">
            <span id="mic-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
            <span id="mic-dot" class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
          </span>
          <span id="voice-mode-label">Voz: ON</span>
        </button>

        <div class="flex items-center gap-1 bg-slate-800 px-1.5 py-1 rounded-lg border border-slate-700 text-xs">
          <span class="text-slate-400 text-[10px]">Aa</span>
          <input type="range" id="font-slider" min="20" max="60" step="2" value="32" class="w-12 sm:w-16 accent-sky-500 cursor-pointer">
          <span id="font-val" class="font-mono text-[10px] text-slate-300 w-4 text-right">32</span>
        </div>

        <button id="btn-mirror-h" title="Modo Espejo Óptico (M)" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono text-xs">↔</button>
        <button id="btn-fullscreen" title="Pantalla Completa (F)" class="p-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0 0l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        </button>
      </div>

    </div>

    <!-- Barra de progreso -->
    <div class="w-full bg-slate-800 h-1">
      <div id="progress-bar" class="bg-gradient-to-r from-sky-500 via-cyan-400 to-indigo-500 h-full w-0 transition-all duration-150"></div>
    </div>
  </header>

  <!-- ================= NOTAS TÉCNICAS Y GUÍA DE BANDA ================= -->
  <div id="band-notes-banner" class="w-full bg-gradient-to-r from-amber-950/80 via-slate-900/95 to-amber-950/80 backdrop-blur border-b border-amber-500/30 text-amber-200 text-xs px-3 sm:px-6 py-2 shrink-0 z-40 relative shadow-md">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 truncate pr-2">
        <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono font-bold text-[10px] uppercase border border-amber-500/40 shrink-0">BANDA</span>
        <span id="band-notes-text" class="font-medium text-slate-200 text-xs truncate">Tono: Sol Mayor (G) • Intro: 4 compases de Teclado • Entrada en el compás 5</span>
      </div>
      <button id="btn-toggle-notes-view" class="text-amber-400 hover:text-amber-300 underline text-[11px] font-semibold shrink-0">Ocultar</button>
    </div>
  </div>

  <!-- ================= ESCENARIO DE LECTURA PRINCIPAL ================= -->
  <main id="teleprompter-stage" class="relative flex-1 bg-black overflow-hidden flex flex-col justify-center">

    <button id="btn-exit-focus" class="hidden absolute top-4 right-4 z-40 bg-slate-900/90 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-full text-xs font-semibold shadow-xl items-center gap-1.5 backdrop-blur">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      <span>Mostrar controles</span>
    </button>

    <!-- Indicador Flotante de Arrastre -->
    <div id="drag-indicator" class="absolute left-1/2 -translate-x-1/2 z-50 bg-sky-600 text-white text-[10px] font-mono font-bold px-3 py-0.5 rounded-full shadow-2xl transition-opacity duration-150 opacity-0 pointer-events-none">
      Línea de lectura: 32%
    </div>

    <!-- Franja Guía Focal Interactiva (Arrastrable con el dedo o ratón) -->
    <div id="guide-overlay" class="absolute left-0 right-0 z-30 flex items-center justify-between px-2 sm:px-6 transition-[top] duration-75" style="top: 32%;">
      <div id="handle-left" class="guide-drag-handle flex items-center gap-1 p-2" title="Arrastra para mover la altura focal">
        <div class="w-0 h-0 border-y-[12px] border-y-transparent border-l-[18px] border-l-sky-500 drop-shadow-[0_0_8px_rgba(14,165,233,0.85)]"></div>
        <div class="hidden sm:block h-[2px] w-8 bg-gradient-to-r from-sky-500 to-transparent"></div>
      </div>

      <div id="handle-center" class="guide-drag-handle flex-1 h-20 bg-sky-500/[0.04] border-y border-sky-500/30 reading-glow rounded flex items-center justify-center">
        <span class="text-[10px] font-mono tracking-widest text-sky-400/40 uppercase">Franja de Entrada</span>
      </div>

      <div id="handle-right" class="guide-drag-handle flex items-center gap-1 p-2" title="Arrastra para mover la altura focal">
        <div class="hidden sm:block h-[2px] w-8 bg-gradient-to-l from-sky-500 to-transparent"></div>
        <div class="w-0 h-0 border-y-[12px] border-y-transparent border-r-[18px] border-r-sky-500 drop-shadow-[0_0_8px_rgba(14,165,233,0.85)]"></div>
      </div>
    </div>

    <!-- Contenedor con Scroll de Texto y Acordes -->
    <div id="scroll-wrapper" class="w-full h-full overflow-y-scroll no-scrollbar cursor-grab active:cursor-grabbing music-font">
      <div id="teleprompter-content" class="max-w-4xl mx-auto px-4 sm:px-12 text-left text-slate-100 font-bold leading-relaxed transition-transform duration-200">
        <!-- Generado dinámicamente con acordes alineados -->
      </div>
    </div>

    <!-- Panel de Estado Inferior -->
    <div id="stats-panel" class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur border border-slate-800 px-3 sm:px-5 py-1.5 rounded-full text-xs text-slate-400 flex items-center gap-2 sm:gap-3 z-20 shadow-xl max-w-[94vw]">
      <span id="detected-transcript" class="text-sky-400 font-mono font-medium truncate max-w-[130px] sm:max-w-[180px]">En espera...</span>
      <span class="text-slate-700">|</span>
      <span class="text-slate-400 text-[11px]">Guía:</span>
      <input type="range" id="guide-pos-slider" min="15" max="70" value="32" class="w-12 sm:w-16 accent-sky-500 h-1 cursor-pointer">
      <span class="text-slate-700">|</span>
      <span class="text-[11px] text-slate-400">Vel:</span>
      <input type="range" id="speed-slider" min="0.5" max="8" step="0.2" value="2.2" class="w-12 sm:w-16 accent-sky-500 h-1 cursor-pointer">
    </div>

  </main>

  <!-- ================= MODAL DE EDICIÓN DEL REPERTORIO ================= -->
  <div id="setlist-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-6 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl flex flex-col max-h-[92vh] shadow-2xl overflow-hidden">
      
      <div class="px-4 sm:px-6 py-3 border-b border-slate-800 flex items-center justify-between bg-slate-950">
        <div class="flex items-center gap-2">
          <span class="text-sky-400 text-lg">🎵</span>
          <div>
            <h3 class="font-bold text-slate-100 text-sm sm:text-base">Repertorio & Letras Armónicas</h3>
            <p class="text-[10px] sm:text-xs text-slate-400">Usa corchetes como [G] o [Am7] para indicar acordes sobre cada palabra</p>
          </div>
        </div>
        <button id="btn-close-setlist" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-12 flex-1 overflow-hidden">
        
        <!-- Lista de temas -->
        <div class="md:col-span-5 border-b md:border-b-0 md:border-r border-slate-800 p-3 flex flex-col gap-2 overflow-hidden bg-slate-900/50">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-400 uppercase">
            <span>Canciones (<span id="song-count">0</span>)</span>
            <button id="btn-new-song" class="text-sky-400 hover:text-sky-300 font-bold">+ Nuevo Tema</button>
          </div>
          <div id="songs-list-container" class="flex-1 overflow-y-auto no-scrollbar space-y-1.5 pr-1 max-h-[25vh] md:max-h-full"></div>
          
          <div class="pt-2 border-t border-slate-800 flex items-center justify-between text-xs">
            <button id="btn-export-setlist" class="text-slate-400 hover:text-white flex items-center gap-1">
              <span>Exportar .JSON</span>
            </button>
            <label class="text-slate-400 hover:text-white cursor-pointer flex items-center gap-1">
              <span>Importar .JSON</span>
              <input type="file" id="input-import-setlist" accept=".json" class="hidden">
            </label>
          </div>
        </div>

        <!-- Editor de canción seleccionada -->
        <div class="md:col-span-7 p-3 sm:p-4 flex flex-col gap-2 bg-slate-950/40 overflow-hidden">
          <div class="grid grid-cols-12 gap-2">
            <input type="text" id="edit-song-title" class="col-span-8 px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-slate-100 text-xs font-semibold focus:outline-none focus:border-sky-500" placeholder="Título del Tema">
            <input type="number" id="edit-song-bpm" class="col-span-4 px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-slate-100 text-xs font-mono focus:outline-none focus:border-sky-500" placeholder="BPM (ej: 80)">
          </div>

          <input type="text" id="edit-song-notes" class="w-full px-3 py-1.5 bg-slate-900 border border-amber-500/30 rounded-lg text-amber-200 text-xs focus:outline-none focus:border-amber-500" placeholder="Notas de Banda: Tono, Intro, Cantidad de compases...">

          <div class="flex-1 flex flex-col overflow-hidden">
            <label class="text-[10px] text-slate-400 mb-1">Letra con cifrado [Acorde] y secciones instrumentales:</label>
            <textarea id="edit-song-content" class="w-full flex-1 p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-slate-100 music-font text-xs leading-relaxed focus:outline-none focus:border-sky-500 resize-none min-h-[120px]" placeholder="Ejemplo:
[G]Nace una [D/F#]flor, todos los [Em]días sale el [C]sol
[Instrumental: Solo de Guitarra - 4 compases]"></textarea>
          </div>

          <div class="flex items-center justify-between pt-1">
            <button id="btn-delete-song" class="text-rose-400 hover:text-rose-300 text-xs font-medium">Eliminar</button>
            <div class="flex items-center gap-2">
              <button id="btn-save-song" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs transition">Guardar</button>
              <button id="btn-load-and-exit" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition">Cargar en Pantalla</button>
            </div>
          </div>
        </div>

      </div>

      <div class="px-4 py-2 bg-slate-950 border-t border-slate-800 flex justify-end">
        <button id="btn-finish-modal" class="text-slate-300 hover:text-white text-xs font-semibold">Cerrar</button>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-slate-800/95 border border-slate-700 text-slate-100 text-xs px-4 py-1.5 rounded-full shadow-2xl pointer-events-none transition-all duration-300 opacity-0 -translate-y-2 z-50"></div>

  <!-- ================= LÓGICA DE LA APLICACIÓN ================= -->
  <script>
    // Repertorio inicial con cifrado estándar anglosajón / latino integrado
    const INITIAL_SETLIST = [
      {
        id: "song_1",

      },
      {
        id: "song_3",
        title: "3. Seminare (Serú Girán)",
        bpm: 68,
        notes: "Tono: Mi menor (Em) • Intro: Órgano 2 compases • Canto íntimo y dinámico",
        content: `[Em]Sigo dando vueltas en la [D]madrugada
[C]Escucho tu voz que me [B7]llama

[G]No ves que no [D]puedo vivir sin [Em]ti
[C]No ves que la lluvia cae sobre [D]mí
Dame un [G]poco de tu a[D]mor
Que me estoy mu[C]riendo de [G]frío`
      }
    ];

    // Escalas para motor de transposición cromática
    const CHROMATIC_SCALE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const FLAT_MAP = { "Db": "C#", "Eb": "D#", "Gb": "F#", "Ab": "G#", "Bb": "A#" };

    // Estado general
    const state = {
      setlist: [...INITIAL_SETLIST],
      currentSongIndex: 0,
      isPlaying: false,
      isVoiceMode: true,
      showChords: true,
      audioClickEnabled: false,
      transposeSemi: 0,
      fontSize: 32,
      speed: 2.2,
      guidePosition: 32,
      scrollPos: 0,
      mirrorH: false,
      currentWordIndex: 0,
      animId: null,
      metroInterval: null,
      isNotesCollapsed: false
    };

    let wordObjects = [];

    // Referencias DOM
    const teleprompterContent = document.getElementById('teleprompter-content');
    const scrollWrapper = document.getElementById('scroll-wrapper');
    const stageElement = document.getElementById('teleprompter-stage');
    const btnTogglePlay = document.getElementById('btn-toggle-play');

    const fontVal = document.getElementById('font-val');

    let editingSongId = null;

    // Notificaciones
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 2200);
    }

    // ================= MOTOR DE TRANSPOSICIÓN ARMÓNICA =================
    function transposeChord(chord, semitones) {
      if (semitones === 0) return chord;
      // Reemplaza tanto la nota base como el bajo alternativo en acordes invertidos como D/F#
      return chord.replace(/([A-G][b#]?)/g, (match) => {
        let note = FLAT_MAP[match] || match;
        let idx = CHROMATIC_SCALE.indexOf(note);
        if (idx === -1) return match;
        let newIdx = (idx + semitones) % 12;
        if (newIdx < 0) newIdx += 12;
        return CHROMATIC_SCALE[newIdx];
      });
    }

    // ================= PARSER DE LETRAS CON CIFRADO INLINE =================
    function cleanWord(str) {
      if (!str) return "";
      return str.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    function renderCurrentSong() {
      const song = state.setlist[state.currentSongIndex];
      if (!song) return;

      bpmDisplay.textContent = song.bpm || 80;
      bandNotesText.textContent = song.notes || "Sin notas técnicas registradas";
      if (!song.notes || !song.notes.trim()) {
        bandNotesBanner.classList.add('banner-collapsed');
      } else if (!state.isNotesCollapsed) {
        bandNotesBanner.classList.remove('banner-collapsed');
      }

      teleprompterContent.innerHTML = '';
      wordObjects = [];
      state.currentWordIndex = 0;

      // Espaciador superior basado en la línea de lectura
      const topSpacer = document.createElement('div');
      topSpacer.id = 'top-spacer';
      topSpacer.style.height = `${state.guidePosition}vh`;
      teleprompterContent.appendChild(topSpacer);

      const lines = song.content.split('\n');
      let globalWordIdx = 0;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed === '') {
          const gap = document.createElement('div');
          gap.className = 'h-5 sm:h-7';
          teleprompterContent.appendChild(gap);
          return;
        }

        // Detección de bloques de solos o secciones instrumentales
        if (trimmed.startsWith('[Instrumental') || trimmed.startsWith('[Solo') || trimmed.startsWith('[Intro') || trimmed.startsWith('[Puente')) {
          const cue = document.createElement('div');
          cue.className = 'section-cue';
          cue.innerHTML = `<strong>🎸 SECCIÓN:</strong> ${trimmed.replace(/[\[\]]/g, '')}`;
          teleprompterContent.appendChild(cue);
          return;
        }

        const lineContainer = document.createElement('div');
        lineContainer.className = 'flex flex-wrap items-end gap-x-2 my-1.5 leading-snug';

        // Parser regex: detecta [Acorde], palabras o espacios
        const tokenRegex = /\[(.*?)\]|([^\s\[]+)|(\s+)/g;
        let match;
        let pendingChord = null;

        while ((match = tokenRegex.exec(line)) !== null) {
          if (match[1]) {
            // Acorde capturado
            pendingChord = transposeChord(match[1], state.transposeSemi);
          } else if (match[2]) {
            // Palabra cantable
            const wordCol = document.createElement('div');
            wordCol.className = 'inline-flex flex-col items-start';

            // Elemento para acorde sobre la palabra
            if (state.showChords) {
              const chordTag = document.createElement('span');
              chordTag.className = 'chord-badge';
              chordTag.textContent = pendingChord || '\u00A0';
              wordCol.appendChild(chordTag);
            }

            const wordSpan = document.createElement('span');
            wordSpan.className = 'prompter-word word-upcoming';
            wordSpan.textContent = match[2];
            wordSpan.dataset.index = globalWordIdx;

            wordObjects.push({
              index: globalWordIdx,
              raw: match[2],
              clean: cleanWord(match[2]),
              el: wordSpan
            });

            wordCol.appendChild(wordSpan);
            lineContainer.appendChild(wordCol);
            globalWordIdx++;
            pendingChord = null;
          }
        }

        // Acorde colgando al final de la línea sin palabra siguiente
        if (pendingChord && state.showChords) {
          const trailCol = document.createElement('div');
          trailCol.className = 'inline-flex flex-col items-start';
          const chordTag = document.createElement('span');
          chordTag.className = 'chord-badge';
          chordTag.textContent = pendingChord;
          trailCol.appendChild(chordTag);
          lineContainer.appendChild(trailCol);
        }

        teleprompterContent.appendChild(lineContainer);
      });

      const bottomSpacer = document.createElement('div');
      bottomSpacer.style.height = '75vh';
      teleprompterContent.appendChild(bottomSpacer);

      updateFontSize();
      updateTransformations();
      highlightWords(0);
      syncSongSelectorUI();
    }

    // ================= RESALTADO Y SEGUIMIENTO VOCAL =================
    function highlightWords(targetIndex) {
      if (wordObjects.length === 0) return;
      state.currentWordIndex = Math.max(0, Math.min(targetIndex, wordObjects.length - 1));

      for (let i = 0; i < wordObjects.length; i++) {
        const item = wordObjects[i];
        if (i < state.currentWordIndex) {
          item.el.className = 'prompter-word word-passed';
        } else if (i === state.currentWordIndex) {
          item.el.className = 'prompter-word word-active';
        } else {
          item.el.className = 'prompter-word word-upcoming';
        }
      }

      if (state.currentWordIndex >= 2 && !state.isNotesCollapsed) {
        bandNotesBanner.classList.add('banner-collapsed');
        state.isNotesCollapsed = true;
        btnToggleNotesView.textContent = "Ver notas";
      }

      const activeEl = wordObjects[state.currentWordIndex]?.el;
      if (activeEl) {
        centerWordOnGuide(activeEl);
      }

      const progress = (state.currentWordIndex / (wordObjects.length - 1)) * 100;
      progressBar.style.width = `${progress}%`;
    }

    function centerWordOnGuide(el) {
      const containerHeight = scrollWrapper.clientHeight;
      const guideY = containerHeight * (state.guidePosition / 100);
      const targetScroll = el.offsetTop - guideY + (el.offsetHeight / 2);

      scrollWrapper.scrollTo({
        top: Math.max(0, targetScroll),
        behavior: 'smooth'
      });
    }

    // ================= METRÓNOMO AUDIBLE Y VISUAL =================
    let audioCtx = null;

    function playClickSound() {
      if (!state.audioClickEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function startMetronome() {
      stopMetronome();
      const song = state.setlist[state.currentSongIndex];
      const bpm = song?.bpm || 80;
      const intervalMs = (60 / bpm) * 1000;

      state.metroInterval = setInterval(() => {
        metroLight.classList.remove('bg-slate-600');
        metroLight.classList.add('bg-sky-400');
        playClickSound();

        setTimeout(() => {
          metroLight.classList.remove('bg-sky-400');
          metroLight.classList.add('bg-slate-600');
        }, 90);
      }, intervalMs);
    }

    function stopMetronome() {
      if (state.metroInterval) {
        clearInterval(state.metroInterval);
        state.metroInterval = null;
      }
      metroLight.classList.replace('bg-sky-400', 'bg-slate-600');
    }

    btnAudioClick.addEventListener('click', () => {
      state.audioClickEnabled = !state.audioClickEnabled;
      btnAudioClick.textContent = state.audioClickEnabled ? '🔊' : '🔈';
      showToast(state.audioClickEnabled ? 'Claqueta de audio activada' : 'Claqueta de audio silenciada');
    });

    // ================= RECONOCIMIENTO DE VOZ =================
    let recognition = null;

    function initSpeech() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) {
        setVoiceMode(false);
        return;
      }

      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'es-ES';

      recognition.onstart = () => {
        micPing.classList.remove('hidden');
        micDot.classList.replace('bg-slate-400', 'bg-emerald-400');
        detectedTranscript.textContent = "Escuchando...";
      };

      recognition.onresult = (e) => {
        let transcript = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript + " ";
        }
        const words = transcript.trim().split(/\s+/).map(cleanWord).filter(w => w.length > 0);
        if (words.length === 0) return;

        const lastWord = words[words.length - 1];
        detectedTranscript.textContent = `"${lastWord}"`;

        // Búsqueda en ventana de texto
        const start = state.currentWordIndex;
        const limit = Math.min(start + 12, wordObjects.length);
        for (let i = start; i < limit; i++) {
          if (wordObjects[i].clean === lastWord || (lastWord.length >= 4 && wordObjects[i].clean.startsWith(lastWord))) {
            highlightWords(i);
            break;
          }
        }
      };

      recognition.onend = () => {
        if (state.isPlaying && state.isVoiceMode) {
          setTimeout(() => {
            if (state.isPlaying && state.isVoiceMode) {
              try { recognition.start(); } catch(err){}
            }
          }, 150);
        } else {
          micPing.classList.add('hidden');
          micDot.classList.replace('bg-emerald-400', 'bg-slate-400');
        }
      };
    }

    function setVoiceMode(enabled) {
      state.isVoiceMode = enabled;
      if (state.isVoiceMode) {
        btnToggleVoice.classList.replace('bg-slate-800', 'bg-sky-600');
        voiceModeLabel.textContent = 'Voz: ON';
        if (state.isPlaying && recognition) {
          try { recognition.start(); } catch(e){}
        }
        showToast('Modo de seguimiento por voz');
      } else {
        btnToggleVoice.classList.replace('bg-sky-600', 'bg-slate-800');
        voiceModeLabel.textContent = 'Voz: OFF';
        if (recognition) {
          try { recognition.stop(); } catch(e){}
        }
        detectedTranscript.textContent = "Modo Continuo";
        showToast('Modo de avance continuo');
      }
    }

    btnToggleVoice.addEventListener('click', () => setVoiceMode(!state.isVoiceMode));

    // Desplazamiento continuo de respaldo
    function continuousStep() {
      if (!state.isPlaying || state.isVoiceMode) return;

      const increment = (state.speed * 0.5);
      state.scrollPos += increment;
      scrollWrapper.scrollTop = state.scrollPos;

      const focalY = scrollWrapper.scrollTop + (scrollWrapper.clientHeight * (state.guidePosition / 100));
      let foundIdx = 0;
      for (let i = 0; i < wordObjects.length; i++) {
        if (wordObjects[i].el.offsetTop <= focalY) {
          foundIdx = i;
        } else {
          break;
        }
      }
      highlightWords(foundIdx);

      if (scrollWrapper.scrollTop + scrollWrapper.clientHeight >= scrollWrapper.scrollHeight - 6) {
        stopPrompter();
        showToast('Fin del tema');
        return;
      }

      state.animId = requestAnimationFrame(continuousStep);
    }

    function startPrompter() {
      state.isPlaying = true;
      playIcon.classList.add('hidden');
      pauseIcon.classList.remove('hidden');
      playLabel.textContent = 'Pausar';
      btnTogglePlay.classList.replace('bg-sky-600', 'bg-emerald-600');

      startMetronome();

      if (state.isVoiceMode) {
        if (!recognition) initSpeech();
        try { recognition.start(); } catch(e){}
      } else {
        state.scrollPos = scrollWrapper.scrollTop;
        state.animId = requestAnimationFrame(continuousStep);
      }
    }

    function stopPrompter() {
      state.isPlaying = false;
      if (state.animId) cancelAnimationFrame(state.animId);
      stopMetronome();
      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }

      playIcon.classList.remove('hidden');
      pauseIcon.classList.add('hidden');
      playLabel.textContent = 'Iniciar';
      btnTogglePlay.classList.replace('bg-emerald-600', 'bg-sky-600');
    }

    function togglePlay() {
      if (state.isPlaying) stopPrompter();
      else startPrompter();
    }

    btnTogglePlay.addEventListener('click', togglePlay);
    btnRewind.addEventListener('click', () => {
      stopPrompter();
      highlightWords(0);
      scrollWrapper.scrollTo({ top: 0, behavior: 'smooth' });
      bandNotesBanner.classList.remove('banner-collapsed');
      state.isNotesCollapsed = false;
      btnToggleNotesView.textContent = "Ocultar";
      showToast('Rebobinado');
    });

    // ================= TRANSPOSICIÓN Y ACORDES =================
    function updateTransposeUI() {
      const sign = state.transposeSemi > 0 ? `+${state.transposeSemi}` : `${state.transposeSemi}`;
      transposeIndicator.textContent = sign;
      renderCurrentSong();
    }

    btnTransposeUp.addEventListener('click', () => {
      state.transposeSemi += 1;
      updateTransposeUI();
      showToast(`Tono transportado: ${transposeIndicator.textContent} semitonos`);
    });

    btnTransposeDown.addEventListener('click', () => {
      state.transposeSemi -= 1;
      updateTransposeUI();
      showToast(`Tono transportado: ${transposeIndicator.textContent} semitonos`);
    });

    btnToggleChords.addEventListener('click', () => {
      state.showChords = !state.showChords;
      btnToggleChords.textContent = `Acordes: ${state.showChords ? 'ON' : 'OFF'}`;
      btnToggleChords.classList.toggle('bg-sky-950', state.showChords);
      btnToggleChords.classList.toggle('bg-slate-800', !state.showChords);
      renderCurrentSong();
    });

    // ================= ARRASTRE DE LÍNEA GUÍA =================
    let isDraggingGuide = false;

    function updateGuidePosition(percent, showPill = true) {
      const clamped = Math.max(15, Math.min(70, Math.round(percent)));
      state.guidePosition = clamped;
      guideOverlay.style.top = `${clamped}%`;
      guidePosSlider.value = clamped;

      const topSpacer = document.getElementById('top-spacer');
      if (topSpacer) topSpacer.style.height = `${clamped}vh`;

      if (showPill) {
        dragIndicator.textContent = `Línea de lectura: ${clamped}%`;
        dragIndicator.style.top = `calc(${clamped}% - 30px)`;
        dragIndicator.classList.remove('opacity-0');
        dragIndicator.classList.add('opacity-100');
      }

      highlightWords(state.currentWordIndex);
    }

    const handles = [document.getElementById('handle-left'), document.getElementById('handle-center'), document.getElementById('handle-right')];
    handles.forEach(h => {
      h.addEventListener('pointerdown', (e) => {
        isDraggingGuide = true;
        h.setPointerCapture(e.pointerId);
      });
      h.addEventListener('pointermove', (e) => {
        if (!isDraggingGuide) return;
        const rect = stageElement.getBoundingClientRect();
        const percent = ((e.clientY - rect.top) / rect.height) * 100;
        updateGuidePosition(percent, true);
      });
      h.addEventListener('pointerup', (e) => {
        if (isDraggingGuide) {
          isDraggingGuide = false;
          try { h.releasePointerCapture(e.pointerId); } catch(err){}
          setTimeout(() => dragIndicator.classList.add('opacity-0'), 600);
        }
      });
    });

    guidePosSlider.addEventListener('input', (e) => updateGuidePosition(parseInt(e.target.value), false));

    // ================= GESTIÓN DEL SETLIST =================
    function syncSongSelectorUI() {
      selectActiveSong.innerHTML = '';
      state.setlist.forEach((song, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = song.title;
        if (idx === state.currentSongIndex) opt.selected = true;
        selectActiveSong.appendChild(opt);
      });
      songCount.textContent = state.setlist.length;
    }

    function renderSetlistModal() {
      songsListContainer.innerHTML = '';
      state.setlist.forEach((song, idx) => {
        const item = document.createElement('div');
        const isActive = idx === state.currentSongIndex;
        item.className = `p-2 rounded-lg border flex items-center justify-between text-xs cursor-pointer transition ${isActive ? 'bg-sky-950/70 border-sky-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'}`;
        item.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <span class="font-mono text-slate-500 font-bold">${idx + 1}.</span>
            <span class="truncate font-semibold">${song.title}</span>
          </div>
          <span class="font-mono text-[10px] text-sky-400 bg-slate-800 px-1.5 py-0.5 rounded">${song.bpm || 80} BPM</span>
        `;
        item.addEventListener('click', () => selectSongForEditing(idx));
        songsListContainer.appendChild(item);
      });
    }

    function selectSongForEditing(idx) {
      const s = state.setlist[idx];
      if (!s) return;
      editingSongId = s.id;
      editSongTitle.value = s.title;
      editSongBpm.value = s.bpm || 80;
      editSongNotes.value = s.notes || "";
      editSongContent.value = s.content;
      renderSetlistModal();
    }

    btnNewSong.addEventListener('click', () => {
      const newSong = {
        id: "song_" + Date.now(),
        title: `Nuevo Tema (${state.setlist.length + 1})`,
        bpm: 90,
        notes: "Tono: C • Intro 4 compases",
        content: `[C]Escribe la [G]letra con los [Am]acordes entre cor[F]chetes`
      };
      state.setlist.push(newSong);
      selectSongForEditing(state.setlist.length - 1);
      syncSongSelectorUI();
    });

    btnSaveSong.addEventListener('click', () => {
      const s = state.setlist.find(item => item.id === editingSongId);
      if (s) {
        s.title = editSongTitle.value.trim() || "Sin Título";
        s.bpm = parseInt(editSongBpm.value) || 80;
        s.notes = editSongNotes.value.trim();
        s.content = editSongContent.value.trim();
        renderSetlistModal();
        syncSongSelectorUI();
        showToast('Tema guardado');
      }
    });

    btnDeleteSong.addEventListener('click', () => {
      if (state.setlist.length <= 1) {
        showToast('Debe existir al menos un tema');
        return;
      }
      state.setlist = state.setlist.filter(s => s.id !== editingSongId);
      state.currentSongIndex = 0;
      selectSongForEditing(0);
      syncSongSelectorUI();
      renderCurrentSong();
      showToast('Tema eliminado');
    });

    btnLoadAndExit.addEventListener('click', () => {
      const sIdx = state.setlist.findIndex(item => item.id === editingSongId);
      if (sIdx !== -1) state.currentSongIndex = sIdx;
      state.transposeSemi = 0;
      transposeIndicator.textContent = "0";
      renderCurrentSong();
      setlistModal.classList.add('hidden');
      showToast('Tema cargado');
    });

    btnOpenSetlist.addEventListener('click', () => {
      if (state.isPlaying) stopPrompter();
      renderSetlistModal();
      selectSongForEditing(state.currentSongIndex);
      setlistModal.classList.remove('hidden');
    });

    btnCloseSetlist.addEventListener('click', () => setlistModal.classList.add('hidden'));
    btnFinishModal.addEventListener('click', () => setlistModal.classList.add('hidden'));

    selectActiveSong.addEventListener('change', (e) => {
      state.currentSongIndex = parseInt(e.target.value);
      state.transposeSemi = 0;
      transposeIndicator.textContent = "0";
      renderCurrentSong();
    });

    btnPrevSong.addEventListener('click', () => {
      if (state.currentSongIndex > 0) {
        state.currentSongIndex--;
        state.transposeSemi = 0;
        transposeIndicator.textContent = "0";
        renderCurrentSong();
      }
    });

    btnNextSong.addEventListener('click', () => {
      if (state.currentSongIndex < state.setlist.length - 1) {
        state.currentSongIndex++;
        state.transposeSemi = 0;
        transposeIndicator.textContent = "0";
        renderCurrentSong();
      }
    });

    // ================= EXPORTACIÓN E IMPORTACIÓN JSON =================
    btnExportSetlist.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.setlist, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `repertorio_banda_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    });

    inputImportSetlist.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported) && imported.length > 0) {
            state.setlist = imported;
            state.currentSongIndex = 0;
            state.transposeSemi = 0;
            renderCurrentSong();
            renderSetlistModal();
            showToast('Repertorio importado correctamente');
          }
        } catch (err) {
          showToast('Formato JSON no válido');
        }
      };
      reader.readAsText(file);
    });

    // ================= CONTROLES VISUALES =================
    function updateFontSize() {
      teleprompterContent.style.fontSize = `${state.fontSize}px`;
      fontVal.textContent = state.fontSize;
      fontSlider.value = state.fontSize;
    }

    fontSlider.addEventListener('input', (e) => {
      state.fontSize = parseInt(e.target.value);
      updateFontSize();
    });

    speedSlider.addEventListener('input', (e) => {
      state.speed = parseFloat(e.target.value);
    });

    function updateTransformations() {
      teleprompterContent.classList.toggle('flip-x', state.mirrorH);
      btnMirrorH.classList.toggle('bg-sky-600', state.mirrorH);
      btnMirrorH.classList.toggle('text-white', state.mirrorH);
    }

    btnMirrorH.addEventListener('click', () => {
      state.mirrorH = !state.mirrorH;
      updateTransformations();
    });

    btnToggleNotesView.addEventListener('click', () => {
      state.isNotesCollapsed = !state.isNotesCollapsed;
      bandNotesBanner.classList.toggle('banner-collapsed', state.isNotesCollapsed);
      btnToggleNotesView.textContent = state.isNotesCollapsed ? "Ver notas" : "Ocultar";
    });

    // Pantalla Completa
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {
          document.body.classList.toggle('focus-mode');
        });
      } else {
        document.exitFullscreen();
      }
    }

    btnFullscreen.addEventListener('click', toggleFullScreen);
    btnExitFocus.addEventListener('click', () => document.body.classList.remove('focus-mode'));

    // Clic directo sobre una palabra para reubicar el punto de lectura
    teleprompterContent.addEventListener('click', (e) => {
      const word = e.target.closest('.prompter-word');
      if (word && word.dataset.index) {
        highlightWords(parseInt(word.dataset.index, 10));
      }
    });

    // Atajos de teclado para escenario o pedales Bluetooth
    window.addEventListener('keydown', (e) => {
      if (!setlistModal.classList.contains('hidden')) return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'r' || e.key === 'R') {
        btnRewind.click();
      } else if (e.key === 'v' || e.key === 'V') {
        setVoiceMode(!state.isVoiceMode);
      } else if (e.key === 'm' || e.key === 'M') {
        btnMirrorH.click();
      } else if (e.key === '+' || e.key === '=') {
        btnTransposeUp.click();
      } else if (e.key === '-') {
        btnTransposeDown.click();
      } else if (e.key === '[' || e.key === 'p' || e.key === 'P') {
        btnPrevSong.click();
      } else if (e.key === ']' || e.key === 'n' || e.key === 'N') {
        btnNextSong.click();
      }
    });

    // Inicialización al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentSong();
      initSpeech();
    });
  </script>
</body>
</html>
